<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELISA Batch Assayer | QC & Reporting</title>
    <style>
        :root {
            --primary: #0f172a;
            --secondary: #3b82f6;
            --secondary-hover: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --success: #059669;
            --success-bg: #d1fae5;
            --warning: #dc2626;
            --warning-bg: #fee2e2;
            --remark-bg: #f1f5f9;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .calculator-card {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 900px;
            margin-top: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 { margin: 0; font-size: 1.75rem; color: var(--primary); }
        .header p { margin: 0.5rem 0 0; font-size: 0.95rem; color: var(--text-muted); }

        .section-title {
            font-size: 1.1rem;
            color: var(--secondary);
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
            margin-top: 2rem;
            font-weight: 600;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .input-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            transition: all 0.2s ease;
            box-sizing: border-box;
            background-color: var(--bg-color);
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            background-color: #ffffff;
        }

        /* Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }

        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: var(--bg-color);
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        td input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        td input:focus {
            outline: none;
            border-color: var(--secondary);
        }

        .cell-result { font-family: monospace; font-weight: bold; font-size: 1.05rem; }
        .status-high { color: var(--warning); }
        .status-low { color: var(--success); }

        /* Buttons */
        button {
            padding: 0.75rem 1.5rem;
            background-color: var(--secondary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover { background-color: var(--secondary-hover); }
        
        .btn-add { background-color: var(--bg-color); color: var(--text-main); border: 1px dashed var(--border); width: 100%; margin-bottom: 2rem;}
        .btn-add:hover { background-color: #e2e8f0; }
        
        .btn-remove { background-color: transparent; color: var(--warning); padding: 0.5rem; font-size: 1.2rem; cursor: pointer; border: none; }
        .btn-remove:hover { background-color: var(--warning-bg); border-radius: 4px; }
        
        .btn-run { width: 100%; padding: 1rem; font-size: 1.1rem; }
        .btn-export { background-color: var(--primary); margin-top: 1rem; width: 100%; display: none; }
        .btn-export:hover { background-color: #1e293b; }

        /* Validation & Messages */
        .error-message {
            display: none; background-color: var(--warning-bg); color: var(--warning);
            padding: 1rem; border-radius: 8px; margin-top: 1rem; font-weight: 600;
            text-align: center; border: 1px solid #fecaca;
        }

        .validation-banner {
            display: none; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem;
            font-weight: 600; text-align: center;
        }
        .banner-valid { background-color: var(--success-bg); color: var(--success); border: 1px solid #a7f3d0; }
        .banner-invalid { background-color: var(--warning-bg); color: var(--warning); border: 1px solid #fecaca; }

        .summary-box {
            display: none; background-color: var(--remark-bg); padding: 1.25rem;
            border-radius: 8px; border-left: 4px solid var(--secondary); margin-top: 1.5rem;
        }

        .report-header { display: none; }

        /* --- PRINT SETTINGS FOR REPORT EXPORT --- */
        @media print {
            body { background-color: white; padding: 0; }
            .calculator-card { box-shadow: none; max-width: 100%; padding: 0; margin: 0;}
            .no-print, button, .header { display: none !important; }
            
            .report-header {
                display: block; text-align: center; margin-bottom: 2rem;
                padding-bottom: 1rem; border-bottom: 2px solid var(--primary);
            }
            .report-header h2 { margin: 0 0 0.5rem 0; }
            
            /* Make inputs look like plain text when printed */
            td input, .grid-inputs input {
                border: none !important;
                background: transparent !important;
                padding: 0 !important;
                font-family: inherit;
                font-size: 1rem;
            }
            
            .summary-box { display: block !important; border: 1px solid #000; background-color: white !important; }
            .validation-banner { display: block !important; border: 1px solid #000; background-color: white !important; }
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <div class="header">
            <h1>ELISA Batch Assayer</h1>
            <p>Pesticide Analysis with Multiple Sample Routing</p>
        </div>

        <div class="report-header">
            <h2>Laboratory Batch Report</h2>
            <p>Organophosphates & Carbamates (Competitive ELISA)</p>
            <p id="reportDate"></p>
        </div>

        <form id="elisaForm">
            <div class="section-title">Calibration & Controls</div>
            <div class="grid-inputs">
                <div class="input-group">
                    <label for="b0">Zero Standard (B₀) OD₄₅₀</label>
                    <input type="number" id="b0" step="any" placeholder="e.g., 1.850" required>
                </div>
                <div class="input-group">
                    <label for="negCtrl">Negative Control OD</label>
                    <input type="number" id="negCtrl" step="any" placeholder="e.g., 1.790" required>
                </div>
                <div class="input-group">
                    <label for="posCtrl">Positive Control OD</label>
                    <input type="number" id="posCtrl" step="any" placeholder="e.g., 0.850" required>
                </div>
            </div>

            <div id="validationBanner" class="validation-banner">
                <span id="validationStatus"></span><br>
                <span id="validationDetails" style="font-size: 0.85rem; font-weight: normal;"></span>
            </div>

            <div class="section-title">Batch Samples</div>
            
            <table id="sampleTable">
                <thead>
                    <tr>
                        <th style="width: 20%;">Sample ID</th>
                        <th style="width: 20%;">OD₄₅₀</th>
                        <th style="width: 15%;">B/B₀ (%)</th>
                        <th style="width: 15%;">Inhibition</th>
                        <th style="width: 20%;">Assessment</th>
                        <th style="width: 10%;" class="no-print"></th>
                    </tr>
                </thead>
                <tbody id="sampleBody">
                    <tr class="sample-row">
                        <td><input type="text" class="sample-id" placeholder="SMP-001" required></td>
                        <td><input type="number" step="any" class="sample-od" placeholder="0.000" required></td>
                        <td class="cell-result res-binding">-</td>
                        <td class="cell-result res-inhibition">-</td>
                        <td class="cell-result res-status">-</td>
                        <td class="no-print" style="text-align: center;">
                            <button type="button" class="btn-remove" onclick="removeRow(this)" title="Remove Sample">✕</button>
                        </td>
                    </tr>
                </tbody>
            </table>

            <button type="button" class="btn-add no-print" onclick="addRow()">+ Add Another Sample</button>

            <button type="submit" class="btn-run no-print">Run Batch Analysis</button>
        </form>

        <div id="uiError" class="error-message"></div>

        <div id="summaryBox" class="summary-box">
            <strong style="color: var(--primary); font-size: 1.1rem; display: block; margin-bottom: 0.5rem;">Batch Summary</strong>
            <span id="summaryText"></span>
        </div>

        <button type="button" id="exportBtn" class="btn-export no-print" onclick="window.print()">🖨️ Export / Save Report as PDF</button>

    </div>

    <script>
        let sampleCounter = 1;

        // Add a new row to the table
        function addRow() {
            sampleCounter++;
            const tbody = document.getElementById('sampleBody');
            const tr = document.createElement('tr');
            tr.className = 'sample-row';
            
            // Format ID like SMP-002, SMP-003, etc.
            const autoId = `SMP-${sampleCounter.toString().padStart(3, '0')}`;

            tr.innerHTML = `
                <td><input type="text" class="sample-id" placeholder="${autoId}" value="${autoId}" required></td>
                <td><input type="number" step="any" class="sample-od" placeholder="0.000" required></td>
                <td class="cell-result res-binding">-</td>
                <td class="cell-result res-inhibition">-</td>
                <td class="cell-result res-status">-</td>
                <td class="no-print" style="text-align: center;">
                    <button type="button" class="btn-remove" onclick="removeRow(this)" title="Remove Sample">✕</button>
                </td>
            `;
            tbody.appendChild(tr);
        }

        // Remove a specific row (ensure at least one remains)
        function removeRow(btn) {
            const tbody = document.getElementById('sampleBody');
            if (tbody.children.length > 1) {
                btn.closest('tr').remove();
            } else {
                alert("You must have at least one sample in the batch.");
            }
        }

        function calculateInhibition(od, b0) {
            return 100 - ((od / b0) * 100);
        }

        // Handle the main calculation process
        document.getElementById('elisaForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const errorBox = document.getElementById('uiError');
            errorBox.style.display = 'none';

            // Fetch Control Values
            const b0_OD = parseFloat(document.getElementById('b0').value);
            const neg_OD = parseFloat(document.getElementById('negCtrl').value);
            const pos_OD = parseFloat(document.getElementById('posCtrl').value);

            if (b0_OD <= 0) {
                errorBox.innerText = "Error: Zero Standard (B₀) must be greater than zero.";
                errorBox.style.display = 'block';
                return;
            }

            // Report Date
            document.getElementById('reportDate').innerText = "Generated: " + new Date().toLocaleString();

            // Quality Control Processing
            const negInhibition = calculateInhibition(neg_OD, b0_OD);
            const posInhibition = calculateInhibition(pos_OD, b0_OD);
            
            let assayValid = true;
            let errorMsg = [];

            if (negInhibition > 20) { assayValid = false; errorMsg.push(`Neg Ctrl Too High (${negInhibition.toFixed(1)}%).`); }
            if (posInhibition < 30) { assayValid = false; errorMsg.push(`Pos Ctrl Too Low (${posInhibition.toFixed(1)}%).`); }

            const banner = document.getElementById('validationBanner');
            const statusText = document.getElementById('validationStatus');
            const detailsText = document.getElementById('validationDetails');

            banner.style.display = 'block';
            if (assayValid) {
                banner.className = "validation-banner banner-valid";
                statusText.innerText = "✓ Assay Valid";
                detailsText.innerText = `Pos Control Inhibition: ${posInhibition.toFixed(1)}% | Neg Control: ${negInhibition.toFixed(1)}%`;
            } else {
                banner.className = "validation-banner banner-invalid";
                statusText.innerText = "⚠ Assay Invalid";
                detailsText.innerText = errorMsg.join(" ") + " Sample results may not be reliable.";
            }

            // Batch Sample Processing
            const rows = document.querySelectorAll('.sample-row');
            let positiveCount = 0;
            let negativeCount = 0;

            rows.forEach(row => {
                const odInput = row.querySelector('.sample-od').value;
                if (!odInput) return; // Skip if somehow empty

                const sample_OD = parseFloat(odInput);
                const relativeBinding = (sample_OD / b0_OD) * 100;
                const sampleInhibition = 100 - relativeBinding;

                // Update Row UI
                row.querySelector('.res-binding').innerText = relativeBinding.toFixed(1) + '%';
                row.querySelector('.res-inhibition').innerText = sampleInhibition.toFixed(1) + '%';

                const statusCell = row.querySelector('.res-status');
                
                if (sampleInhibition > 20) {
                    statusCell.innerText = "POSITIVE";
                    statusCell.className = "cell-result res-status status-high";
                    positiveCount++;
                } else {
                    statusCell.innerText = "NEGATIVE";
                    statusCell.className = "cell-result res-status status-low";
                    negativeCount++;
                }
            });

            // Update Summary Box
            const summaryBox = document.getElementById('summaryBox');
            const total = positiveCount + negativeCount;
            document.getElementById('summaryText').innerText = 
                `Analyzed ${total} sample(s). Found ${positiveCount} Positive (exceeds 20% inhibition threshold) and ${negativeCount} Negative.`;
            summaryBox.style.display = 'block';

            // Show Export Button
            document.getElementById('exportBtn').style.display = 'block';
        });
    </script>
</body>
</html>
